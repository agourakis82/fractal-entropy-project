name: neurofractal
channels: [conda-forge, r]
dependencies:
  - python=3.10
  - r-base=4.3
  - r-revtools        # triagem & deduplicação
  - r-metagear        # extração & forms
  - r-metafor         # meta‑análise
  - r-prisma          # fluxograma PRISMA (ou 'PRISMA2020')
  - r-robvis          # risco de viés visual
  - r-tidyverse
  - r-readxl
  - r-devtools
  - jupyterlab
  - asreview          # (pip) active‑learning screening (opcional)
  - pip:
      - asreview